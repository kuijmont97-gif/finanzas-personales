{% extends "core/base.html" %}

{% block content %}
<h2>Eliminar Cuenta</h2>
<p>¿Seguro que quieres eliminar la cuenta "{{ cuenta.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'lista_cuentas' %}">Cancelar</a>
{% endblock %}
